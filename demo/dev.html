<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dev</title>
    <!-- #include virtual="/imports.html" -->
</head>

<body>
    <form>
        <fieldset disabled name=tasks>
            <scratch-box enh-ab-sorb="name and value from #{{createDemo}}" enh-be-importing=scratch-box/root.mjs>
                <label for={{createDemo}}>Create demo<label>
                <input data-id="{{@ createDemo}}" type=checkbox>
                    
                <span slot=labelTxt ab-sorb="textContent from #{{createDemo}}?.nextElement"></span>
            </scratch-box>
            <scratch-box disabled enh-ab-sorb="
                #{{writeArticle}}?.name to ?.name.
                #{{writeArticle}}?.checked to ?.value.
                ">
                <label>
                    <input data-id="{{@ writeArticle}}" type=checkbox>
                    Write article
                </label>
                <span slot=labelTxt ab-sorb="textContent from #{{writeArticle}}?.nextElement"></span>
            </scratch-box>
            <scratch-box enh-ab-sorb="name and value from #{{exercise}}">
                <label>
                    <input data-id="{{@ exercise}}" type=checkbox>
                    Exercise
                </label>
                <span -id slot=labelTxt ab-sorb="textContent from #{{exercise}}?.nextElement"></span>
            </scratch-box>
        </fieldset>

    </form>


    <script type=module>
        import 'be-importing/index.js';
    </script>
</body>

</html>
