<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dev</title>
    <!-- #include virtual="/imports.html" -->
</head>

<body>
    <form>
        <fieldset disabled name=tasks>
            <div be-gone="when scratch-box defined, after ">
                <label>
                    <input data-id="{{@ createDemo}}" type=checkbox>
                    Create demo
                </label>
                <label>
                    <input data-id="{{@ writeArticle}}" type=checkbox>
                    Write article
                </label>
                <label>
                    <input data-id="{{@ exercise}}" type=checkbox>
                    Exercise
                </label>
            </div>
            <scratch-box enh-ab-sorb="name and value from #{{createDemo}}" enh-be-importing=scratch-box/root.mjs>
                <span slot=labelTxt ab-sorb="tbd from #{{createDemo}}"></span>
            </scratch-box>
            <scratch-box enh-ab-sorb="name and value from #{{writeArticle}}">
                <span slot=labelTxt ab-sorb="tbd from #{{writeArticle}}"></span>
            </scratch-box>
            <scratch-box enh-ab-sorb="name and value from #{{exercise}}">
                <span slot=labelTxt ab-sorb="tbd from #{{exercise}}"></span>
            </scratch-box>
        </fieldset>

    </form>


    <script type=module>
        import 'be-importing/index.js';
    </script>
</body>

</html>
