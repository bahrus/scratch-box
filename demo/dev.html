<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Dev</title>
    <!-- #include virtual="/imports.html" -->
</head>

<body>
    <form>
        <fieldset disabled name=tasks>
            <div be-gone="when scratch-box defined, after ">
                <label>
                    <input be-gone-transfer="name and value to #{{@ createDemo}}" type=checkbox>
                    <span be-gone-insert="into #{{createDemo}}" data-slot=labelTxt>Create demo</span>
                </label>
                <label>
                    <input be-gone-transfer="name and value to #{{@ writeArticle}}" type=checkbox>
                    <span be-gone-insert="into #{{writeArticle}}" data-slot=labelTxt>Write article</span>
                </label>
                <label>
                    <input be-gone-transfer="name and value to #{{@ exercise}}" type=checkbox>
                    <span be-gone-insert="into #{{exercise}}" data-slot=labelTxt>Exercise</span>
                </label>
            </div>
            <scratch-box data-id="{{createDemo}}" enh-be-importing=scratch-box/root.mjs></scratch-box>
            <scratch-box data-id="{{writeArticle}}"></scratch-box>
            <scratch-box data-id="{{exercise}}"></scratch-box>
        </fieldset>

    </form>


    <script type=module>
        import 'be-importing/index.js';
    </script>
</body>

</html>
